<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1145" height="1374" viewBox="0 0 1145 1374" role="img" aria-labelledby="title desc">
  <title id="title">MOSIP Release History</title>
  <desc id="desc">Timeline mock-up of MOSIP releases, latest first. Platform releases are consolidation milestones; component releases are grouped under the platform release they follow.</desc>

  <style>
    text { font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #0f172a; }
    .h1 { font-size: 28px; font-weight: 700; }
    .lead { font-size: 15px; fill: #5b6b86; }
    .when { font-size: 14.5px; font-weight: 700; }
    .kind { font-size: 14px; fill: #5b6b86; }
    .name { font-size: 19px; font-weight: 700; }
    .name-lg { font-size: 20px; font-weight: 700; }
    .body { font-size: 14.5px; }
    .soft { font-size: 14.5px; fill: #5b6b86; }
    .meta { font-size: 14px; fill: #5b6b86; }
    .date { font-size: 14.5px; fill: #5b6b86; text-anchor: end; }
    .link { font-size: 14.5px; font-weight: 600; fill: #0b62fd; text-anchor: end; }
    .pill { font-size: 13px; font-weight: 600; text-anchor: middle; }
    .grp { font-size: 15px; font-weight: 600; }
    .btn { font-size: 14px; font-weight: 600; text-anchor: middle; }
    .th { font-size: 13px; font-weight: 500; fill: #5b6b86; }
    .td { font-size: 13.5px; }
    .td-soft { font-size: 13.5px; fill: #5b6b86; }
    .td-strong { font-size: 13.5px; font-weight: 600; }
    .lg-name { font-size: 13px; font-weight: 600; }
    .lg-note { font-size: 12px; fill: #5b6b86; }
    .arrow { fill: none; stroke: #0b62fd; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .chev { fill: none; stroke: #0f172a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .t-red { fill: #d9151f; }
    .t-green { fill: #0a6b2c; }
    .t-blue { fill: #0b62fd; }
    .t-grey { fill: #55657f; }
    .t-white { fill: #ffffff; }
    .red { color: #e5131d; }
    .green { color: #0a8035; }
    .blue { color: #0b62fd; }
  </style>

  <defs>
    <!-- Component release: isometric cube inside a hexagon -->
    <symbol id="cube" viewBox="0 0 32 32">
      <polygon points="16,2.5 27.7,9.25 27.7,22.75 16,29.5 4.3,22.75 4.3,9.25" fill="#ffffff" fill-opacity="0.6" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
      <polygon points="16,8.5 22.5,12.25 16,16 9.5,12.25" fill="currentColor" fill-opacity="0.25"/>
      <polygon points="9.5,12.25 16,16 16,23.5 9.5,19.75" fill="currentColor" fill-opacity="0.6"/>
      <polygon points="16,16 22.5,12.25 22.5,19.75 16,23.5" fill="currentColor" fill-opacity="0.4"/>
    </symbol>
    <!-- Platform release: stacked layers -->
    <symbol id="layers" viewBox="0 0 32 32">
      <polygon points="16,3 29.5,10 16,17 2.5,10" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      <polyline points="3,16 16,22.75 29,16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="3,22 16,28.75 29,22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <path id="arrow" class="arrow" d="M0 0H13M8 -5L13 0L8 5"/>
    <path id="chev-right" class="chev" d="M-3 -6L3 0L-3 6"/>
    <path id="chev-down" class="chev" d="M-6 -3L0 3L6 -3"/>
  </defs>

  <rect width="1145" height="1374" fill="#ffffff"/>

  <!-- Heading -->
  <text class="h1" x="27" y="37">MOSIP Release History</text>
  <text class="lead" x="27" y="65">Latest releases at the top. Platform releases are consolidation milestones.</text>
  <text class="lead" x="27" y="86">Component releases are independent updates and can be applied to specific platform versions.</text>

  <!-- Legend -->
  <g id="legend">
    <rect x="820" y="8" width="300" height="96" rx="8" fill="#f6f7f9" stroke="#e6eaf0"/>
    <use xlink:href="#cube" class="blue" x="837" y="19" width="22" height="22"/>
    <text class="lg-name" x="875" y="29">Platform Release</text>
    <text class="lg-note" x="875" y="47">Consolidated platform version</text>
    <use xlink:href="#cube" class="green" x="837" y="63" width="22" height="22"/>
    <text class="lg-name" x="875" y="72">Component Release</text>
    <text class="lg-note" x="875" y="90">Individual or grouped component update</text>
  </g>

  <!-- Timeline rail -->
  <line x1="165" y1="122" x2="165" y2="1318" stroke="#c9d1dc" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- 10 Nov 2024: component release, critical patch -->
  <g id="release-id-repository-1-2-1">
    <text class="when" x="33" y="156">10 Nov 2024</text>
    <text class="kind" x="33" y="178">Component</text>
    <text class="kind" x="33" y="199">Release</text>
    <circle cx="165" cy="151" r="7" fill="#e5131d"/>

    <rect x="202" y="122" width="915" height="100" rx="8" fill="#fdf1f2" stroke="#f9c9cc"/>
    <rect x="216" y="136" width="56" height="61" rx="8" fill="#fcd3d5"/>
    <use xlink:href="#cube" class="red" x="227" y="149.5" width="34" height="34"/>
    <text class="name" x="303" y="153">ID Repository v1.2.1</text>
    <rect x="501" y="136" width="110" height="23" rx="11.5" fill="#fdd5d6"/>
    <text class="pill t-red" x="556" y="152">Critical Patch</text>
    <text class="body" x="303" y="180">Addresses a critical security vulnerability (CVE-XXXX-XXXX).</text>
    <text class="meta" x="303" y="203">Applies only to: MOSIP Platform v1.2.x (e.g., 1.2.0)</text>
    <text class="date" x="1100" y="152">10 Nov 2024</text>
    <text class="link" x="1080" y="185">View release notes</text>
    <use xlink:href="#arrow" x="1086" y="180"/>
  </g>

  <!-- 20 Oct 2024: component release, patch -->
  <g id="release-id-authentication-1-3-2">
    <text class="when" x="33" y="267">20 Oct 2024</text>
    <text class="kind" x="33" y="289">Component</text>
    <text class="kind" x="33" y="310">Release</text>
    <circle cx="165" cy="262" r="7" fill="#0a8035"/>

    <rect x="202" y="233" width="915" height="105" rx="8" fill="#eef7f1" stroke="#d5ebdc"/>
    <rect x="218" y="250" width="57" height="61" rx="8" fill="#cdeed6"/>
    <use xlink:href="#cube" class="green" x="229.5" y="263.5" width="34" height="34"/>
    <text class="name" x="306" y="266">ID Authentication v1.3.2</text>
    <rect x="545" y="250" width="62" height="23" rx="11.5" fill="#d3efdb"/>
    <text class="pill t-green" x="576" y="266">Patch</text>
    <text class="body" x="306" y="293">Bug fixes and security updates.</text>
    <text class="meta" x="306" y="317">Applies to: MOSIP Platform v1.3.x</text>
    <text class="date" x="1100" y="267">20 Oct 2024</text>
    <text class="link" x="1080" y="297">View release notes</text>
    <use xlink:href="#arrow" x="1086" y="292"/>
  </g>

  <!-- 05 Oct 2024: component release, feature -->
  <g id="release-registration-processor-1-4-1">
    <text class="when" x="33" y="383">05 Oct 2024</text>
    <text class="kind" x="33" y="405">Component</text>
    <text class="kind" x="33" y="426">Release</text>
    <circle cx="165" cy="378" r="7" fill="#0a8035"/>

    <rect x="202" y="349" width="915" height="107" rx="8" fill="#eef7f1" stroke="#d5ebdc"/>
    <rect x="218" y="367" width="58" height="62" rx="8" fill="#cdeed6"/>
    <use xlink:href="#cube" class="green" x="230" y="381" width="34" height="34"/>
    <text class="name" x="306" y="383">Registration Processor v1.4.1</text>
    <rect x="598" y="365" width="78" height="24" rx="12" fill="#dbe8ff"/>
    <text class="pill t-blue" x="637" y="381.5">Feature</text>
    <text class="body" x="306" y="410">New features and performance improvements.</text>
    <text class="meta" x="306" y="434">Applies to: MOSIP Platform v1.3.x</text>
    <text class="date" x="1100" y="384">05 Oct 2024</text>
    <text class="link" x="1080" y="414">View release notes</text>
    <use xlink:href="#arrow" x="1086" y="409"/>
  </g>

  <!-- 15 Aug 2024: platform release v1.3.0 -->
  <g id="platform-1-3-0">
    <text class="when" x="33" y="504">15 Aug 2024</text>
    <text class="kind" x="33" y="526">Platform</text>
    <text class="kind" x="33" y="548">Release</text>
    <circle cx="165" cy="499.5" r="9" fill="#0b62fd"/>

    <rect x="202" y="474" width="915" height="293" rx="8" fill="#f7fafe" stroke="#dfeaf8"/>
    <path d="M202 482a8 8 0 0 1 8 -8H1109a8 8 0 0 1 8 8V586H202Z" fill="#e8f2fe"/>
    <rect x="218" y="492" width="58" height="63" rx="8" fill="#cde2fe"/>
    <use xlink:href="#layers" class="blue" x="231" y="507.5" width="32" height="32"/>
    <text class="name-lg" x="307" y="511.5">MOSIP Platform v1.3.0</text>
    <rect x="553" y="492" width="135" height="25" rx="12.5" fill="#d3e4ff"/>
    <text class="pill t-blue" x="620.5" y="509">Latest Platform</text>
    <text class="soft" x="307" y="541">Consolidated platform release with validated component versions.</text>
    <text class="soft" x="307" y="564">Includes stability, security, and new capabilities.</text>
    <text class="date" x="1100" y="503.5">15 Aug 2024</text>
    <rect x="896.5" y="515.5" width="208.5" height="44.5" rx="6" fill="#0b5cff"/>
    <text class="btn t-white" x="991" y="542.5">View platform release</text>
    <path d="M1070 537.750H1083M1078 532.750L1083 537.750L1078 542.75" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- collapsed group -->
    <rect x="216" y="596" width="889" height="73.5" rx="8" fill="#f2f5f8" stroke="#e9edf2"/>
    <use xlink:href="#chev-right" x="245" y="633"/>
    <text class="grp" x="280.5" y="626">Component releases after v1.3.0 (2 releases)</text>
    <text class="meta" x="280.5" y="651">15 Aug 2024 – Present</text>
    <rect x="947" y="610.5" width="150.5" height="44" rx="6" fill="#ffffff" stroke="#d7dce4"/>
    <text class="btn" x="1022" y="637.5">Expand to view</text>

    <!-- collapsed group -->
    <rect x="216" y="679" width="889" height="74" rx="8" fill="#f2f5f8" stroke="#e9edf2"/>
    <use xlink:href="#chev-right" x="245" y="716"/>
    <text class="grp" x="280.5" y="709">Component releases between v1.2.0 and v1.3.0 (8 releases)</text>
    <text class="meta" x="280.5" y="734">10 Jan 2023 – 14 Aug 2024</text>
    <rect x="947" y="693.5" width="150.5" height="44.5" rx="6" fill="#ffffff" stroke="#d7dce4"/>
    <text class="btn" x="1022" y="721">Expand to view</text>
  </g>

  <!-- 10 Jan 2023: platform release v1.2.0 (LTS) -->
  <g id="platform-1-2-0">
    <text class="when" x="33" y="817">10 Jan 2023</text>
    <text class="kind" x="33" y="839.5">Platform</text>
    <text class="kind" x="33" y="861">Release</text>
    <circle cx="165" cy="812.5" r="9" fill="#0b62fd"/>

    <rect x="202" y="779" width="915" height="410" rx="8" fill="#f7fafe" stroke="#dfeaf8"/>
    <path d="M202 787a8 8 0 0 1 8 -8H1109a8 8 0 0 1 8 8V886.500H202Z" fill="#e8f2fe"/>
    <rect x="218" y="799.5" width="58.5" height="63.5" rx="8" fill="#cde2fe"/>
    <use xlink:href="#layers" class="blue" x="231.25" y="815.25" width="32" height="32"/>
    <text class="name-lg" x="307.5" y="819">MOSIP Platform v1.2.0</text>
    <rect x="553" y="800" width="53" height="25" rx="12.5" fill="#dde6f3"/>
    <text class="pill t-grey" x="579.5" y="817">LTS</text>
    <text class="soft" x="307.5" y="846.5">Consolidated platform release with validated component versions.</text>
    <text class="soft" x="307.5" y="870">Includes key feature enhancements and stability improvements.</text>
    <text class="date" x="1100" y="817">10 Jan 2023</text>
    <text class="link" x="1078" y="846">View platform release</text>
    <use xlink:href="#arrow" x="1084" y="841"/>

    <!-- expanded group: maintenance releases -->
    <rect x="215" y="896" width="890" height="194" rx="8" fill="#fdeced" stroke="#f9d4d6"/>
    <use xlink:href="#chev-down" x="240" y="931"/>
    <text class="grp" x="274" y="925.5">Maintenance component releases after v1.2.0 (1 release)</text>
    <text class="meta" x="274" y="951">10 Jan 2023 – Present</text>

    <rect x="223" y="967" width="873" height="115" rx="6" fill="#ffffff" stroke="#f3d9db"/>
    <path d="M223 973a6 6 0 0 1 6 -6H1090a6 6 0 0 1 6 6V1013H223Z" fill="#f3f5f9"/>
    <line x1="223" y1="1013" x2="1096" y2="1013" stroke="#e6eaf0"/>
    <text class="th" x="236" y="995">Date</text>
    <text class="th" x="334" y="995">Component</text>
    <text class="th" x="446.5" y="995">Version</text>
    <text class="th" x="519" y="995">Type</text>
    <text class="th" x="633" y="995">Description</text>
    <text class="th" x="844" y="995">Applies to Platform</text>

    <text class="td-soft" x="236" y="1049">10 Nov 2024</text>
    <text class="td-strong" x="334" y="1049">ID Repository</text>
    <text class="td-strong" x="446.5" y="1049">v1.2.1</text>
    <rect x="511" y="1032.5" width="102" height="23" rx="11.5" fill="#fdd5d6"/>
    <text class="pill t-red" x="562" y="1048.5">Critical Patch</text>
    <text class="td-soft" x="633" y="1041">Addresses a critical security</text>
    <text class="td-soft" x="633" y="1062">vulnerability (CVE-XXXX-XXXX).</text>
    <text class="td-soft" x="844" y="1049">v1.2.x (e.g., 1.2.0)</text>
    <text class="link" x="1062" y="1049" style="font-size:13.5px">View details</text>
    <use xlink:href="#arrow" x="1068" y="1044.5"/>

    <!-- collapsed group -->
    <rect x="216" y="1104" width="889" height="73.5" rx="8" fill="#f2f5f8" stroke="#e9edf2"/>
    <use xlink:href="#chev-right" x="245" y="1141"/>
    <text class="grp" x="280" y="1134">Component releases between v1.1.0 and v1.2.0 (12 releases)</text>
    <text class="meta" x="280" y="1159">15 Mar 2022 – 09 Jan 2023</text>
    <rect x="947" y="1119" width="150.5" height="43.5" rx="6" fill="#ffffff" stroke="#d7dce4"/>
    <text class="btn" x="1022" y="1145.5">Expand to view</text>
  </g>

  <!-- 20 Jul 2021: platform release v1.1.0 -->
  <g id="platform-1-1-0">
    <text class="when" x="33" y="1237">20 Jul 2021</text>
    <text class="kind" x="33" y="1260">Platform</text>
    <text class="kind" x="33" y="1281">Release</text>
    <circle cx="166" cy="1232" r="9" fill="#0b62fd"/>

    <rect x="203" y="1206.5" width="913" height="95" rx="8" fill="#e8f2fe" stroke="#d6e6fb"/>
    <rect x="219" y="1223" width="57.5" height="62" rx="8" fill="#cde2fe"/>
    <use xlink:href="#layers" class="blue" x="231.75" y="1238" width="32" height="32"/>
    <text class="name-lg" x="307.5" y="1243">MOSIP Platform v1.1.0</text>
    <text class="soft" x="307.5" y="1275">Initial production-ready platform release with core components.</text>
    <text class="date" x="1100" y="1238.5">20 Jul 2021</text>
    <text class="link" x="1078" y="1271">View platform release</text>
    <use xlink:href="#arrow" x="1084" y="1266"/>
  </g>
</svg>
